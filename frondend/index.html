<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicting Disease Spread</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Predicting Disease Spread</h1>

    <form id="predictionForm">

        <input type="number" id="country" placeholder="Country" required>

        <input type="number" id="continent" placeholder="Continent" required>

        <input type="number" id="population" placeholder="Population" required>

        <input type="number" id="recovered" placeholder="Recovered" required>

        <input type="number" id="deaths" placeholder="Deaths" required>

        <input type="number" id="tests" placeholder="Tests" required>

        <button type="submit">Predict Disease Cases</button>

    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                country: Number(document.getElementById("country").value),
                continent: Number(document.getElementById("continent").value),
                population: Number(document.getElementById("population").value),
                Recovered: Number(document.getElementById("recovered").value),
                Deaths: Number(document.getElementById("deaths").value),
                Tests: Number(document.getElementById("tests").value)
            };

            try {
                const response = await fetch("http://127.0.0.1:8000/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const prediction = await response.json();

                if (response.ok) {
                    result.textContent =
                        "Predicted Cases: " + prediction.predicted_cases;
                } else {
                    result.textContent =
                        "Error: " + JSON.stringify(prediction);
                }

            } catch (error) {
                result.textContent =
                    "Could not connect to the backend API.";
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicting Disease Spread</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #123b63;
        }

        .description {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            background: #eef6ff;
            color: #123b63;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Predicting Disease Spread</h1>

            <p class="description">
                Enter the required disease-related information to estimate
                the number of cases.
            </p>

            <form id="predictionForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label for="country">Country Code</label>
                        <input type="number" id="country" required>
                    </div>

                    <div class="input-group">
                        <label for="continent">Continent Code</label>
                        <input type="number" id="continent" required>
                    </div>

                    <div class="input-group">
                        <label for="population">Population</label>
                        <input type="number" id="population" required>
                    </div>

                    <div class="input-group">
                        <label for="recovered">Recovered</label>
                        <input type="number" id="recovered" step="any" required>
                    </div>

                    <div class="input-group">
                        <label for="deaths">Deaths</label>
                        <input type="number" id="deaths" required>
                    </div>

                    <div class="input-group">
                        <label for="tests">Tests</label>
                        <input type="number" id="tests" required>
                    </div>

                    <div class="input-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" required>
                    </div>

                    <div class="input-group">
                        <label for="month">Month</label>
                        <input type="number" id="month" required>
                    </div>

                    <div class="input-group">
                        <label for="day_of_month">Day of Month</label>
                        <input type="number" id="day_of_month" required>
                    </div>

                    <div class="input-group">
                        <label for="hour">Hour</label>
                        <input type="number" id="hour" required>
                    </div>

                </div>

                <button type="submit">
                    Predict Disease Cases
                </button>

            </form>

            <div id="result"></div>

            <div class="footer">
                AI-powered disease spread prediction system
            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            result.textContent = "Making prediction...";

            const data = {

                country:
                    Number(document.getElementById("country").value),

                continent:
                    Number(document.getElementById("continent").value),

                population:
                    Number(document.getElementById("population").value),

                Recovered:
                    Number(document.getElementById("recovered").value),

                Deaths:
                    Number(document.getElementById("deaths").value),

                Tests:
                    Number(document.getElementById("tests").value),

                year:
                    Number(document.getElementById("year").value),

                month:
                    Number(document.getElementById("month").value),

                day_of_month:
                    Number(document.getElementById("day_of_month").value),

                hour:
                    Number(document.getElementById("hour").value)
            };


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                const prediction = await response.json();


                if (response.ok) {

                    result.textContent =
                        "Predicted Cases: " +
                        prediction.predicted_cases.toFixed(2);

                } else {

                    result.textContent =
                        "Error: " +
                        JSON.stringify(prediction);
                }


            } catch (error) {

                result.textContent =
                    "Could not connect to the backend API.";
            }

        });

    </script>

</body>
</html>
